[package]
name = "sparks-vtt"
version = "0.1.0"
edition = "2021"
description = "Sparks of Dynasty Virtual Tabletop — Rust Backend & Rules Engine"

[dependencies]
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["fs"] }
rand = "0.8"
